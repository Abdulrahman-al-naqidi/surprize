<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Surprise For You 💕</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%}
body{
  overflow:hidden;min-height:100vh;
  font-family:"Segoe UI",Tahoma,Arial,sans-serif;
  background:
    radial-gradient(circle at 20% 20%,rgba(255,255,255,.8),transparent 28%),
    radial-gradient(circle at 80% 15%,rgba(255,180,210,.4),transparent 25%),
    linear-gradient(135deg,#fff1f7,#ffe1ed 45%,#f8d9ff);
  color:#5a2340
}
.stars,.confetti,.balloons,.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.star{position:absolute;font-size:14px;opacity:.65;animation:twinkle 2.5s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(.7);opacity:.25}50%{transform:scale(1.25);opacity:.9}}
.screen{position:relative;z-index:5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{
  width:min(92vw,620px);padding:42px 28px;text-align:center;
  border:1px solid rgba(255,255,255,.75);border-radius:30px;
  background:rgba(255,255,255,.58);backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
  box-shadow:0 25px 70px rgba(116,42,87,.18)
}
.eyebrow{font-size:15px;letter-spacing:2px;color:#a34873;margin-bottom:14px;direction:ltr}
h1{margin:0;font-size:clamp(36px,10vw,64px);line-height:1.05;color:#a52f67;text-shadow:0 5px 20px rgba(165,47,103,.16)}
.name{margin:14px 0 26px;font-size:clamp(28px,7vw,42px);color:#6d244a;font-weight:800}
.intro{font-size:18px;line-height:1.8;margin:0 auto 28px;max-width:460px}
button{
  border:0;cursor:pointer;color:white;font-size:18px;font-weight:700;
  padding:15px 28px;border-radius:999px;
  background:linear-gradient(135deg,#d83d7d,#a72d69);
  box-shadow:0 12px 30px rgba(167,45,105,.3);
  transition:transform .2s ease,box-shadow .2s ease
}
button:hover{transform:translateY(-2px) scale(1.02)}
button:active{transform:scale(.97)}
.surprise{display:none}.surprise.show{display:flex;animation:appear .9s ease both}
@keyframes appear{from{opacity:0;transform:scale(.92) translateY(15px)}to{opacity:1;transform:scale(1) translateY(0)}}
.cake{font-size:55px;margin-bottom:10px;animation:cakeBounce 1.8s ease-in-out infinite}
@keyframes cakeBounce{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
.message{font-size:clamp(22px,5.5vw,32px);line-height:1.9;font-weight:700;color:#69213f;margin:8px auto 18px}
.message span{display:block;opacity:0;transform:translateY(14px);animation:lineIn .8s ease forwards}
.message span:nth-child(1){animation-delay:.25s}.message span:nth-child(2){animation-delay:.85s}
.message span:nth-child(3){animation-delay:1.45s}.message span:nth-child(4){animation-delay:2.05s}
.message span:nth-child(5){animation-delay:2.65s}
@keyframes lineIn{to{opacity:1;transform:translateY(0)}}
.love{font-size:22px;color:#b22e69;margin-top:12px;opacity:0;animation:lineIn .8s ease 3.25s forwards}
.balloon{
  position:absolute;bottom:-160px;width:58px;height:72px;border-radius:50% 50% 47% 47%;
  opacity:.9;animation:rise linear forwards;filter:drop-shadow(0 8px 8px rgba(0,0,0,.08))
}
.balloon:before{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);
  width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:10px solid currentColor}
.balloon:after{content:"";position:absolute;left:50%;top:72px;width:1px;height:125px;background:rgba(90,35,64,.35)}
@keyframes rise{0%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-55vh) rotate(5deg)}100%{transform:translateY(-125vh) rotate(-6deg)}}
.heart{position:absolute;bottom:-50px;font-size:24px;animation:heartRise linear forwards;opacity:.8}
@keyframes heartRise{to{transform:translateY(-115vh) rotate(25deg) scale(1.5);opacity:0}}
.confetti-piece{position:absolute;top:-30px;width:9px;height:16px;animation:confettiFall linear forwards}
@keyframes confettiFall{to{transform:translateY(115vh) rotate(720deg);opacity:0}}
.signature{margin-top:22px;font-size:14px;color:#9c5577;direction:ltr}
@media(max-width:480px){.card{padding:34px 20px;border-radius:24px}.intro{font-size:16px}button{font-size:16px}}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="balloons" id="balloons"></div>
<div class="hearts" id="hearts"></div>
<div class="confetti" id="confetti"></div>

<main class="screen" id="introScreen">
  <section class="card">
    <div class="eyebrow">A LITTLE SURPRISE FOR YOU</div>
    <h1>💕</h1>
    <div class="name">Hey Aya...</div>
    <p class="intro">عملتلك حاجة صغيرة مخصوص عشانك 🥹❤️<br>جاهزة تشوفي المفاجأة؟</p>
    <button id="openBtn">افتحي المفاجأة 🎁</button>
  </section>
</main>

<main class="screen surprise" id="surpriseScreen">
  <section class="card">
    <div class="cake">🎂</div>
    <div class="eyebrow">HAPPY BIRTHDAY, AYA</div>
    <div class="message">
      <span>كل سنة وانتي طيبة يا حبيبة قلبي ❤️</span>
      <span>يا كتكوتي 🥹💕</span>
      <span>يا أغلى ما عندي...</span>
      <span>بحبك، وهفضل أحبك،</span>
      <span>وبموت فيكي ❤️</span>
    </div>
    <div class="love">🎈 ❤️ ✨ 🎈 ❤️ ✨ 🎈</div>
    <div class="signature">Made with love, just for Aya ❤️</div>
  </section>
</main>

<script>
const openBtn=document.getElementById("openBtn");
const introScreen=document.getElementById("introScreen");
const surpriseScreen=document.getElementById("surpriseScreen");
const balloons=document.getElementById("balloons");
const hearts=document.getElementById("hearts");
const confetti=document.getElementById("confetti");
const stars=document.getElementById("stars");
const heartSymbols=["❤️","💕","💗","💖","💘"];

for(let i=0;i<28;i++){
  const s=document.createElement("div");
  s.className="star";s.textContent="✦";
  s.style.left=Math.random()*100+"%";s.style.top=Math.random()*100+"%";
  s.style.animationDelay=Math.random()*2.5+"s";stars.appendChild(s);
}
function createBalloon(){
  const b=document.createElement("div");b.className="balloon";
  const hue=Math.floor(Math.random()*45)+320;
  b.style.background=`hsl(${hue},72%,68%)`;
  b.style.color=`hsl(${hue},72%,58%)`;
  b.style.left=Math.random()*100+"%";
  b.style.animationDuration=6+Math.random()*5+"s";
  b.style.animationDelay=Math.random()*1.2+"s";
  balloons.appendChild(b);setTimeout(()=>b.remove(),13000);
}
function createHeart(){
  const h=document.createElement("div");h.className="heart";
  h.textContent=heartSymbols[Math.floor(Math.random()*heartSymbols.length)];
  h.style.left=Math.random()*100+"%";h.style.fontSize=18+Math.random()*20+"px";
  h.style.animationDuration=4+Math.random()*4+"s";
  hearts.appendChild(h);setTimeout(()=>h.remove(),9000);
}
function createConfetti(){
  const c=document.createElement("div");c.className="confetti-piece";
  c.style.left=Math.random()*100+"%";c.style.height=8+Math.random()*12+"px";
  c.style.width=5+Math.random()*7+"px";
  c.style.background=`hsl(${Math.random()*360},75%,65%)`;
  c.style.animationDuration=3+Math.random()*4+"s";
  c.style.animationDelay=Math.random()*.8+"s";
  confetti.appendChild(c);setTimeout(()=>c.remove(),8500);
}
function launchCelebration(){
  for(let i=0;i<32;i++)setTimeout(createBalloon,i*100);
  for(let i=0;i<35;i++)setTimeout(createHeart,i*75);
  for(let i=0;i<100;i++)setTimeout(createConfetti,i*25);
  setInterval(createBalloon,650);setInterval(createHeart,500);setInterval(createConfetti,180);
}
openBtn.addEventListener("click",()=>{
  introScreen.style.display="none";
  surpriseScreen.classList.add("show");
  launchCelebration();
});
</script>
</body>
</html>
